<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 디그팟 로고 (각진 버전) — 활짝 모찌(BLOSSOM) · Coral 배경. 모서리 둥글림 없이 사각. -->
  <rect width="200" height="200" fill="#FF6B6B"/>

  <g transform="translate(100 112) scale(1.2) translate(-100 -112)">
    <!-- 모찌 본체 (흰색 떡) -->
    <ellipse cx="100" cy="124" rx="50" ry="44" fill="#FFFFFF"/>

    <!-- 머리 위 큰 벚꽃 -->
    <g transform="translate(100 62)">
      <g transform="scale(1.35)">
        <circle cx="0" cy="-6" r="5" fill="#FF9FB0"/>
        <circle cx="6" cy="-2" r="5" fill="#FF9FB0"/>
        <circle cx="3" cy="6" r="5" fill="#FF9FB0"/>
        <circle cx="-3" cy="6" r="5" fill="#FF9FB0"/>
        <circle cx="-6" cy="-2" r="5" fill="#FF9FB0"/>
        <circle cx="0" cy="0" r="2.6" fill="#FFF8C4"/>
      </g>
    </g>

    <!-- 오른쪽 작은 벚꽃 봉오리 -->
    <g transform="translate(140 78)">
      <g transform="scale(0.55)">
        <circle cx="0" cy="-6" r="5" fill="#FFB6C1"/>
        <circle cx="6" cy="-2" r="5" fill="#FFB6C1"/>
        <circle cx="3" cy="6" r="5" fill="#FFB6C1"/>
        <circle cx="-3" cy="6" r="5" fill="#FFB6C1"/>
        <circle cx="-6" cy="-2" r="5" fill="#FFB6C1"/>
        <circle cx="0" cy="0" r="2.6" fill="#FFF8C4"/>
      </g>
    </g>

    <!-- 왼쪽 작은 벚꽃 봉오리 -->
    <g transform="translate(60 78)">
      <g transform="scale(0.45)">
        <circle cx="0" cy="-6" r="5" fill="#FFC9D9"/>
        <circle cx="6" cy="-2" r="5" fill="#FFC9D9"/>
        <circle cx="3" cy="6" r="5" fill="#FFC9D9"/>
        <circle cx="-3" cy="6" r="5" fill="#FFC9D9"/>
        <circle cx="-6" cy="-2" r="5" fill="#FFC9D9"/>
        <circle cx="0" cy="0" r="2.6" fill="#FFF8C4"/>
      </g>
    </g>

    <!-- 얼굴 -->
    <ellipse cx="86" cy="122" rx="2.8" ry="3.6" fill="#2B2B2B"/>
    <ellipse cx="114" cy="122" rx="2.8" ry="3.6" fill="#2B2B2B"/>
    <path d="M92 136 Q100 142 108 136" stroke="#2B2B2B" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <ellipse cx="72" cy="132" rx="5" ry="3.3" fill="#FF9AAA" opacity="0.55"/>
    <ellipse cx="128" cy="132" rx="5" ry="3.3" fill="#FF9AAA" opacity="0.55"/>
  </g>
</svg>
