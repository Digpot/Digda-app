name: digda
description: 디그팟 - 디지털 그룹 다이어리
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.0.0
  intl: ^0.20.2
  table_calendar: ^3.1.0
  flutter_svg: ^2.0.10+1
  path_drawing: ^1.0.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  world_holidays: ^2.0.1
  share_plus: ^10.1.4
  app_links: ^7.0.0
  url_launcher: ^6.3.0
  # API 통신 및 인증 토큰 보관
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: ^5.2.1
  provider: ^6.1.2
  # 소셜 로그인 SDK
  kakao_flutter_sdk_user: ^1.9.7
  flutter_naver_login: ^2.1.1
  sign_in_with_apple: ^6.1.4
  # FCM 푸시 알림
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.0
  # 광고 (배너 + 보상형) — AdMob
  google_mobile_ads: ^5.2.0
  # iOS 앱 추적 투명성(ATT) 동의 — 개인화 광고용
  app_tracking_transparency: ^2.0.6
  # 앱 버전 표기를 빌드(pubspec)에서 동적으로 읽기
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/digda_icon.png"
  adaptive_icon_background: "#FF6B6B"
  adaptive_icon_foreground: "assets/images/digda_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
  assets:
    - assets/icons/
    - assets/images/
    - assets/svg/
    - assets/map/
    - .env
